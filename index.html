<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA — Multi-Tenant College Operations Portal</title>
    
    <!-- Anti-Caching & BFcache Defense Directives -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Google Fonts: Outfit, Inter, JetBrains Mono, Cinzel (Wordmark), Montserrat (Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@300;400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/assets/nexora-logo-mark.png" />

    <!-- Tailwind CSS CDN matching demo.html -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration strictly matching demo.html & frontend_spec.md -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cosmic: {
                950: '#090611', // Cosmic Void background
                900: '#130E22', // Deep Nebula card surface
                850: '#16102B', // Hover card surface
                800: '#1C1533', // Elevated modal surface
                700: '#2A2240', // Nebula border tone
                600: '#3A2E5B', // Accent border
              },
              cyan: {
                DEFAULT: '#00E5FF', // Electric Cyan
                glow: 'rgba(0, 229, 255, 0.25)',
                muted: 'rgba(0, 229, 255, 0.12)',
              },
              violet: {
                DEFAULT: '#7C3AED', // Ultraviolet brand secondary
                glow: 'rgba(124, 58, 237, 0.25)',
                muted: 'rgba(124, 58, 237, 0.12)',
              },
              mint: {
                DEFAULT: '#10B981', // Success accent
                glow: 'rgba(16, 185, 129, 0.25)',
                muted: 'rgba(16, 185, 129, 0.12)',
              },
              amber: {
                DEFAULT: '#F59E0B',
                glow: 'rgba(245, 158, 11, 0.25)',
              },
              crimson: {
                DEFAULT: '#EF4444',
                glow: 'rgba(239, 68, 68, 0.25)',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            boxShadow: {
              'glow-cyan': '0 0 25px -5px rgba(0, 229, 255, 0.35)',
              'glow-violet': '0 0 25px -5px rgba(124, 58, 237, 0.35)',
              'glass-card': '0 8px 32px 0 rgba(0, 0, 0, 0.45)',
              'glass-elevated': '0 12px 40px -10px rgba(0, 0, 0, 0.7)',
            }
          }
        }
      }
    </script>

    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #090611;
      }
      ::-webkit-scrollbar-thumb {
        background: #2A2240;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00E5FF;
      }

      /* Ambient background mesh */
      .cosmic-mesh {
        background-image: 
          radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(0, 229, 255, 0.12) 0px, transparent 50%),
          radial-gradient(at 50% 100%, rgba(124, 58, 237, 0.10) 0px, transparent 50%);
        background-attachment: fixed;
      }

      /* Tree branch connector lines for BranchedMenu */
      .branch-connector {
        position: relative;
      }
      .branch-connector::before {
        content: '';
        position: absolute;
        left: 1.15rem;
        top: 0;
        bottom: 0.5rem;
        width: 1px;
        background: linear-gradient(180deg, #2A2240 0%, #7C3AED 50%, rgba(0, 229, 255, 0.4) 100%);
      }

      .branch-item {
        position: relative;
      }
      .branch-item::before {
        content: '';
        position: absolute;
        left: -1.35rem;
        top: 50%;
        width: 1rem;
        height: 1px;
        background: #2A2240;
      }
      .branch-item.active::before {
        background: #00E5FF;
        box-shadow: 0 0 8px #00E5FF;
      }

      /* Glass Prism effect */
      .prism-glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .prism-glass:hover {
        border-color: rgba(0, 229, 255, 0.35);
        background: linear-gradient(135deg, rgba(0, 229, 255, 0.08) 0%, rgba(124, 58, 237, 0.05) 100%);
      }
    </style>
  </head>
  <body class="bg-cosmic-950 text-slate-100 font-sans antialiased cosmic-mesh min-h-screen selection:bg-cyan selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
